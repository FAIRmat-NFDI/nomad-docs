name: Deploy MkDocs Site

on:
  push:
    branches: ["develop"]
    # Only release tags (v1.4.3, v2.0.0); pre-releases such as v2.1.0rc1 are
    # not deployed. scripts/docs_version.py enforces the same pattern.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  UV_VERSION: 0.6
  # Point the `nomad_url()` macro at the central production instance so the
  # published docs render real API URLs. The values are repository variables
  # (Settings > Secrets and variables > Actions > Variables), so they can be
  # changed without a commit; re-run this workflow afterwards. Local and Oasis
  # builds that do not set them keep the Oasis default
  # (http://localhost:8000/nomad-oasis/...).
  NOMAD_SERVICES_API_HOST: ${{ vars.NOMAD_SERVICES_API_HOST }}
  NOMAD_SERVICES_API_PORT: ${{ vars.NOMAD_SERVICES_API_PORT }}
  NOMAD_SERVICES_API_BASE_PATH: ${{ vars.NOMAD_SERVICES_API_BASE_PATH }}
  NOMAD_SERVICES_HTTPS: ${{ vars.NOMAD_SERVICES_HTTPS }}

# develop/tag pushes all write to the gh-pages branch, so serialize them.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the built site to the gh-pages branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # A missing variable would publish broken API links, so stop here instead.
      - name: Check NOMAD URL variables
        run: |
          for name in NOMAD_SERVICES_API_HOST NOMAD_SERVICES_API_PORT NOMAD_SERVICES_API_BASE_PATH NOMAD_SERVICES_HTTPS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name} is not set (Settings > Secrets and variables > Actions > Variables)."
              exit 1
            fi
          done

      # mike deploys into the gh-pages branch; make it available even in a shallow clone.
      # (|| true: on a very first deploy the branch may not exist yet, mike will create it.)
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      # mike commits to gh-pages, so it needs a git identity.
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      # Development docs from the develop branch. mike treats non-numeric
      # versions as "development versions" and sorts them above releases.
      - name: Deploy develop
        if: github.ref == 'refs/heads/develop'
        run: |
          uv run \
            --with 'nomad-lab[dev,infrastructure] @ https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-FAIR.git' \
            mike deploy develop --push

      # Tagged releases become selectable versions, see scripts/docs_version.py:
      # from v2.0.0 on, one version per minor release that each patch replaces
      # (v2.0.3 -> 2.0); older tags one version per patch (v1.4.3 -> 1.4.3).
      - name: Resolve docs version
        id: docs-version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -o pipefail
          git ls-remote --tags origin \
            | sed 's|.*refs/tags/||' \
            | python3 scripts/docs_version.py "${GITHUB_REF_NAME}" \
            | tee -a "$GITHUB_OUTPUT"

      # The newest release tag is labelled "(stable)" and becomes the default page.
      - name: Deploy release tag
        if: steps.docs-version.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.docs-version.outputs.version }}
          ALIAS: ${{ steps.docs-version.outputs.alias }}
          STABLE: ${{ steps.docs-version.outputs.stable }}
        run: |
          run_mike() {
            uv run \
              --with 'nomad-lab[dev,infrastructure] @ https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-FAIR.git' \
              mike "$@"
          }

          # The exact version (2.0.3) becomes an alias that redirects every page
          # to 2.0. Each deploy rewrites all aliases of the version, so always
          # pass --alias-type=redirect (mike's default symlinks would replace
          # the redirects of earlier patches).
          echo "Deploying tag ${GITHUB_REF_NAME} as docs version ${VERSION}"
          run_mike deploy --alias-type=redirect "${VERSION}" ${ALIAS:+"${ALIAS}"}

          if [ "${STABLE}" = "true" ]; then
            echo "Tag ${GITHUB_REF_NAME} is the newest release; marking ${VERSION} as stable"
            # Remove the "(stable)" label from any previous stable version.
            while IFS= read -r v; do
              if [ "${v}" != "${VERSION}" ]; then
                run_mike retitle "${v}" "${v}"
              fi
            done < <(run_mike list --json \
              | python3 -c '[print(i["version"]) for i in __import__("json").load(__import__("sys").stdin) if "(stable)" in i.get("title", "")]')
            run_mike retitle "${VERSION}" "${VERSION} (stable)"
            run_mike set-default "${VERSION}"
          else
            echo "Tag ${GITHUB_REF_NAME} is not the newest release; deploying without the stable label"
          fi

          # Push all mike commits after the version metadata is ready.
          git push origin gh-pages

      # GitHub Pages cannot rewrite old unversioned URLs to the current stable
      # version. Mirror the stable build into the root, and preserve root files
      # such as CNAME that mike does not manage.
      - name: Preserve custom domain and unversioned docs
        run: |
          git worktree add /tmp/gh-pages gh-pages
          uv run python scripts/sync_legacy_urls.py /tmp/gh-pages

          if [ -f docs/CNAME ]; then
            cp docs/CNAME /tmp/gh-pages/CNAME
          else
            echo "No docs/CNAME found; skipping custom-domain setup"
          fi

          git -C /tmp/gh-pages add -A
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "Root compatibility files are already up to date"
          else
            git -C /tmp/gh-pages commit -m "Preserve unversioned documentation URLs"
            git -C /tmp/gh-pages push origin gh-pages
          fi
