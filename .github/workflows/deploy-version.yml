name: Deploy a specific version (backfill)

# One-off deploys of versions whose tags predate the mike workflow and
# therefore cannot trigger it themselves (e.g. v1.4.0 .. v1.4.3).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy, e.g. v1.4.2"
        required: true

# Serialize with the regular deploy workflow: both write to gh-pages.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the built site to the gh-pages branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install uv
        # Needs a recent uv: older versions put '--with' packages in an
        # ephemeral env where the 'mkdocs build' subprocess spawned by mike
        # cannot find the mike plugin. (The regular deploy workflow avoids
        # this by declaring mike as a project dependency.)
        uses: astral-sh/setup-uv@v7

      - name: Fetch gh-pages branch and configure git
        run: |
          git fetch origin gh-pages --depth=1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Tags older than the mike change lack extra.version.provider: mike, so
      # their pages would not show the version selector. Inject it textually
      # (the config contains !!python tags, so it cannot be safely re-parsed).
      - name: Enable version selector for older configs
        run: |
          python3 - <<'EOF'
          import pathlib, re
          p = pathlib.Path('mkdocs.yml')
          s = p.read_text()
          if 'provider: mike' not in s:
              m = re.search(r'(?m)^extra:\s*$', s)
              if m:
                  s = s[:m.end()] + '\n  version:\n    provider: mike' + s[m.end():]
              else:
                  s += 'extra:\n  version:\n    provider: mike\n'
              p.write_text(s)
              print('injected extra.version.provider: mike')
          else:
              print('already configured')
          EOF

      - name: Deploy version
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid tag: ${TAG}; expected v<major>.<minor>.<patch>"
            exit 1
          fi

          run_mike() {
            uv run \
              --with mike \
              --with 'nomad-lab[dev,infrastructure] @ https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-FAIR.git' \
              mike "$@"
          }

          VERSION=${TAG#v}
          echo "Deploying tag ${TAG} as version ${VERSION}"
          run_mike deploy "${VERSION}"

          LATEST_TAG=$(git ls-remote --tags origin \
            | sed 's|.*refs/tags/||' \
            | grep -v '\^{}' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' \
            | sort -V \
            | tail -1)
          if [ "${LATEST_TAG}" = "${TAG}" ]; then
            echo "Tag ${TAG} is the newest release; marking ${VERSION} as stable"
            # Remove the "(stable)" label from any previous stable version.
            while IFS= read -r v; do
              if [ "${v}" != "${VERSION}" ]; then
                run_mike retitle "${v}" "${v}"
              fi
            done < <(run_mike list --json \
              | python3 -c '[print(i["version"]) for i in __import__("json").load(__import__("sys").stdin) if "(stable)" in i.get("title", "")]')
            run_mike retitle "${VERSION}" "${VERSION} (stable)"
            run_mike set-default "${VERSION}"
          else
            echo "Tag ${TAG} is not the newest release (${LATEST_TAG}); deploying without the stable label"
          fi

          # Push all mike commits after the version metadata is ready.
          git push origin gh-pages
        env:
          TAG: ${{ inputs.tag }}

      # mike manages version directories, not root files such as CNAME.
      - name: Preserve custom domain
        run: |
          if [ ! -f docs/CNAME ]; then
            echo "No docs/CNAME found; skipping custom-domain setup"
            exit 0
          fi

          git worktree add /tmp/gh-pages gh-pages
          cp docs/CNAME /tmp/gh-pages/CNAME
          git -C /tmp/gh-pages add CNAME
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "CNAME is already up to date"
          else
            git -C /tmp/gh-pages commit -m "Update CNAME"
            git -C /tmp/gh-pages push origin gh-pages
          fi
